# =============================================================================
# Nginx rate limiting cho OLCO (olco.com.au)
# Mục tiêu: chặn crawler/SEO tool bắn request song song dồn dập làm max CPU VPS.
# Sau khi đã bật ISR (Full Route Cache) ở Next.js, đây là lớp phòng thủ thứ 2 ở rìa.
# (Bạn nói chưa set Cloudflare — file này thay thế tạm cho tới khi có CF.)
#
# Cách dùng (AlmaLinux / RHEL — config ở /etc/nginx/, KHÔNG có sites-available):
#   1. Copy 2 dòng `limit_*_zone` + 2 dòng `limit_*_status` vào block `http { ... }`
#      của /etc/nginx/nginx.conf (KHÔNG để trong server{}).
#   2. Copy các dòng `limit_conn` + `limit_req` vào block `server { ... }` ở
#      /etc/nginx/conf.d/<ten-site>.conf (đặt limit_req trong location /).
#   3. AlmaLinux có SELinux: sudo setsebool -P httpd_can_network_connect 1
#   4. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ---- Đặt trong http { } ----------------------------------------------------
# Zone đếm theo IP. 10m RAM ~ 160k IP. rate=30r/s vì 1 khách thật mở trang lần
# đầu bắn rất nhiều request song song (/_next/image, RSC prefetch của <Link>...).
limit_req_zone  $binary_remote_addr  zone=crawl:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

# Trả 429 (Too Many Requests) thay vì 503 mặc định — đúng chuẩn cho SEO tool.
limit_req_status  429;
limit_conn_status 429;

# ---- Đặt trong server { } --------------------------------------------------
server {
    server_name olco.com.au www.olco.com.au;

    # Tối đa 20 kết nối đồng thời / IP.
    limit_conn conn 20;

    # Trang HTML / điều hướng (động/ISR): áp rate limit. burst=50 cho phép một
    # lần tải trang thật (gồm prefetch RSC) dồn ngắn rồi vẫn ok; nodelay xử lý
    # burst ngay, chỉ request vượt xa mức mới bị 429.
    # QUAN TRỌNG: chỉ giới hạn ở đây, KHÔNG giới hạn ảnh/asset bên dưới.
    location / {
        limit_req zone=crawl burst=50 nodelay;

        proxy_pass http://127.0.0.1:3010;   # cổng FE Next thực tế trên VPS này
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh tối ưu của Next (/_next/image) — KHÔNG rate limit.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tài nguyên tĩnh bất biến (_next/static) — KHÔNG rate limit, cache mạnh.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # (Tùy chọn) Chặn thẳng bot crawl nặng nếu KHÔNG phải team SEO của bạn.
    # if ($http_user_agent ~* "(MJ12bot|DotBot|AhrefsBot|SemrushBot|PetalBot|Bytespider)") {
    #     return 429;
    # }
}
